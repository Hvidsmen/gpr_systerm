name: Django checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: '1'
      DJANGO_DB_PATH: /tmp/gpr-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements.staging.lock
      - run: python -m pip install -r requirements.staging.lock
      - run: python manage.py check
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput

  windows-installer:
    name: Windows PowerShell installer checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse acceptance installer scripts
        shell: powershell
        run: |
          $failed = $false
          foreach ($scriptName in @('bootstrap-staging.ps1', 'install-staging.ps1', 'control-staging.ps1', 'repair-staging.ps1', 'clear-staging-personnel.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "ops/$scriptName").Path, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { $parseErrors | Format-List; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Verify bootstrap download and isolation
        shell: powershell
        run: .\tests\powershell\staging_bootstrap.tests.ps1

      - name: Verify TEST recovery controller isolation
        shell: powershell
        run: .\tests\powershell\staging_repair.tests.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify bounded TEST child shutdown on Windows
        shell: powershell
        run: python -m unittest apps.accounts.test_staging_process_stop apps.accounts.test_staging_repair apps.accounts.test_clear_staging_personnel apps.accounts.test_staging_venv apps.accounts.test_staging_manage apps.accounts.test_staging_preflight -v
