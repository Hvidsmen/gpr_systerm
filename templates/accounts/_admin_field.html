{% load form_ui %}
<div class="admin-field{% if field.errors %} admin-field-invalid{% endif %}">
{% if field|checkbox_field %}<div class="form-check">{{ field }} {{ field.label_tag }}</div>{% else %}<label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}{% if field.field.required %}<span class="text-danger" aria-hidden="true"> *</span>{% endif %}</label>{{ field }}{% endif %}
{% if field.help_text %}<div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
{% if field.errors %}<div class="admin-field-errors" role="alert">{{ field.errors }}</div>{% endif %}
</div>
