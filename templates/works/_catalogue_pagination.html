{% if is_paginated %}<nav aria-label="Страницы справочника" class="catalogue-pagination">
<span>Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_previous %}<a class="btn btn-sm btn-outline-secondary" href="?{% if filter_query %}{{ filter_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Назад</a>{% endif %}
{% if page_obj.has_next %}<a class="btn btn-sm btn-outline-secondary" href="?{% if filter_query %}{{ filter_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Далее</a>{% endif %}</nav>{% endif %}
