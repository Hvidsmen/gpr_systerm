{% load l10n %}<div class="housing-plan-months">{% for cell in months %}<div class="housing-plan-month{% if forloop.first %} housing-plan-month-current{% endif %}" data-plan-month="{{ cell.month|date:'Y-m' }}"{% if cell.versions %} title="Редакции: {{ cell.versions }}"{% endif %}><span>{{ cell.month|date:'m.Y' }}</span><strong data-plan-month-value="{% if cell.value is not None %}{{ cell.value|unlocalize }}{% endif %}">{% if cell.value is None %}—{% else %}{{ cell.value|floatformat:'-2' }}{% endif %}</strong></div>{% endfor %}</div>
