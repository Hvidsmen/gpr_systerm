{% extends 'base.html' %}{% load static %}
{% block content %}<a href="{% url 'personnel:lodging' %}?camp={{ camp.pk }}&amp;date={{ day|date:'Y-m-d' }}">← Проживание · {{ camp.name }}</a>{% include 'personnel/_lodging_presence.html' %}<section class="card card-body mt-3" style="max-width:800px"><h1 class="h4">{{ title }}</h1><form method="post">{% csrf_token %}<input type="hidden" name="camp" value="{{ camp.pk }}"><input type="hidden" name="date" value="{{ day|date:'Y-m-d' }}"><input type="hidden" name="version" value="{{ version }}"><input type="hidden" name="presence_session" value="{{ presence_session }}">{{ form.as_p }}<button class="btn btn-primary">Сохранить</button></form></section>{% endblock %}
{% block extra_js %}<script src="{% static 'personnel/lodging.js' %}?v=20261121-camp-presence" defer></script>{% endblock %}
