<div class="col-12 col-xl-4"><section class="card h-100"><div class="card-body"><h3 class="h5">{{ title }}</h3><p class="display-6 mb-2">{{ count }}</p><p class="text-muted">{{ description }}</p><form method="post" onsubmit="return confirm('Подтвердить необратимую очистку раздела «{{ title }}»?')">{% csrf_token %}<input type="hidden" name="cleanup_action" value="{{ action }}"><label class="form-label" for="confirm-{{ action }}">Введите <strong>{{ confirmation_word }}</strong></label><input class="form-control mb-3" id="confirm-{{ action }}" name="confirmation" autocomplete="off" required><button class="btn btn-danger" {% if not count %}disabled{% endif %}>Очистить</button></form></div></section></div>
