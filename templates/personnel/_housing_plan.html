<div class="housing-summary-plans" data-housing-plan aria-label="Планы и дефицит по источникам">{% for source in housing_plan_groups %}<div class="housing-summary-source" data-housing-plan-source="{{ source.object.pk }}" data-plan-kind="{{ source.kind }}"><div class="housing-summary-source-line"><span class="housing-source-label" title="{{ source.object.name }}"><span class="badge bg-light text-dark border">{{ source.kind }}</span><strong>{{ source.object.name }}</strong></span><button type="button" class="housing-plan-peak-toggle" data-plan-month-toggle aria-controls="housing-source-months-{{ forloop.counter }}" aria-expanded="false" title="Максимальный месячный план за пять месяцев. Нажмите, чтобы увидеть месяцы."><strong data-source-peak-total>{% if source.peak_total is None %}—{% else %}{{ source.peak_total|floatformat:'-2' }}{% endif %}</strong><span aria-hidden="true">▾</span></button><span title="Сотрудники на вахте в ВЖГ, связанных с этим источником.">На вахте <b data-source-on-shift>{{ source.on_shift }}</b></span><span class="housing-plan-shortage{% if source.shortage %} has-shortage{% endif %}" title="Дефицит штата: максимальный месячный план этого источника минус сотрудники на вахте, минимум ноль.">Дефицит <b data-source-shortage>{% if source.shortage is None %}—{% else %}{{ source.shortage|floatformat:'-2' }}{% endif %}</b></span></div></div>{% empty %}<span class="small text-muted">План не найден · дефицит не рассчитан</span>{% endfor %}</div>
