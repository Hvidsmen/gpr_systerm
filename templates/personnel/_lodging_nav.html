<nav class="lodging-nav" aria-label="Учёт проживания" data-lodging-nav data-lodging-nav-active="{{ lodging_nav_active }}">
  <a class="btn {% if lodging_nav_active == 'lodging' %}btn-primary{% else %}btn-outline-primary{% endif %}"{% if lodging_nav_active == 'lodging' %} aria-current="page"{% endif %} href="{% url 'personnel:lodging' %}{% if camp %}?camp={{ camp.pk }}{% endif %}">Проживание</a>
  <a class="btn {% if lodging_nav_active == 'report' %}btn-primary{% else %}btn-outline-primary{% endif %}"{% if lodging_nav_active == 'report' %} aria-current="page"{% endif %} href="{% url 'personnel:lodging_report' %}{% if camp %}?camp={{ camp.pk }}&amp;date={{ day|date:'Y-m-d' }}&amp;mode=PORTAL{% endif %}">Состояние на дату</a>
  <a class="btn {% if lodging_nav_active == 'composition' %}btn-primary{% else %}btn-outline-primary{% endif %}"{% if lodging_nav_active == 'composition' %} aria-current="page"{% endif %} href="{% url 'personnel:lodging_composition' %}{% if camp %}?camps={{ camp.pk }}&amp;date={{ day|date:'Y-m-d' }}&amp;mode=FACTUAL{% endif %}">Состав проживающих</a>
  <a class="btn {% if lodging_nav_active == 'sync' %}btn-primary{% else %}btn-outline-primary{% endif %}"{% if lodging_nav_active == 'sync' %} aria-current="page"{% endif %} href="{% url 'personnel:lodging_sync' %}{% if camp %}?camp={{ camp.pk }}&amp;date={{ day|date:'Y-m-d' }}{% endif %}">Сверка с перевахтой</a>
  <a class="btn {% if lodging_nav_active == 'organizations' %}btn-primary{% else %}btn-outline-primary{% endif %}"{% if lodging_nav_active == 'organizations' %} aria-current="page"{% endif %} href="{% url 'personnel:lodging_organizations' %}">Организации</a>
  <a class="btn btn-outline-primary" href="{% url 'personnel:lodging' %}{% if camp %}?camp={{ camp.pk }}{% endif %}#history">История</a>
