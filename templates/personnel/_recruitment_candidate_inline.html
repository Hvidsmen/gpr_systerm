<section class="candidate-inline-card" data-candidate-inline-card="{{ row.pk }}"{% if saved %} data-save-success="true"{% endif %}>
<div class="recruitment-heading mb-2"><div><h4 class="h6 mb-1">{{ row.full_name }}</h4><span class="recruitment-status recruitment-stage-{{ row.stage|lower }}">{{ row.get_stage_display }}</span></div><div class="recruitment-actions"><a class="btn btn-sm btn-outline-secondary" href="{% url 'personnel:recruitment_candidate_card' row.pk %}">Открыть отдельно</a><button class="btn btn-sm btn-outline-secondary" type="button" data-candidate-inline-close>Свернуть</button></div></div>
{% if saved %}<div class="alert alert-success py-2" role="status">Карточка сохранена.</div>{% endif %}
<form method="post" action="{% url 'personnel:recruitment_candidate_inline' row.pk %}" data-candidate-inline-form data-candidate-id="{{ row.pk }}">{% csrf_token %}{% include 'forms/fields.html' with form=form %}{% if can_edit %}<div class="recruitment-actions"><button class="btn btn-primary" type="submit">Сохранить карточку</button><span class="small" role="status" data-candidate-inline-status></span></div>{% else %}<p class="small text-muted mb-0">Для изменения карточки нужна роль подбора персонала.</p>{% endif %}</form>
</section>
