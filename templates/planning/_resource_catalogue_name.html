{% load access %}{% if resource.catalogue_url %}<a href="{% if request.user|may:resource.catalogue_edit_route %}{{ resource.catalogue_url }}{% else %}{{ resource.catalogue_read_url }}{% endif %}" target="_blank" rel="noopener noreferrer" data-resource-catalogue title="Открыть ресурс в справочнике · новая вкладка" aria-label="{{ resource.label }} — открыть в справочнике в новой вкладке">{{ resource.label }} <span aria-hidden="true">↗</span></a>{% else %}{{ resource.label }}{% endif %}
{% if resource.catalogue_review_label %} <small class="badge {% if resource.catalogue_review_status == 'REJECTED' %}bg-danger{% elif resource.catalogue_review_status == 'CONFIRMED' %}bg-success{% else %}bg-warning text-dark{% endif %}" data-catalogue-row-status>{{ resource.catalogue_review_label }}</small>{% endif %}
