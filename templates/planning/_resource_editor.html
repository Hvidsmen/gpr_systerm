{% load static %}
<link rel="stylesheet" href="{% static 'planning/resource_targets.css' %}?v=20261026-graph">
<style>
.work-resource-entry-heading {display:flex; justify-content:space-between; align-items:start; gap:8px;}
.work-resource-entry-heading > strong {flex:1;}
.work-resource-entry-heading > button {padding:2px 5px; font-size:11px;}
.work-resource-columns {overflow-x:auto; margin:4px 0 8px;}
.work-resource-table {width:100%; min-width:600px; table-layout:fixed; border:1px solid #dce7ef; border-collapse:collapse; font-size:12px;}
.work-resource-table th {background:#f0f6fa; text-align:left; padding:7px 10px; font-weight:600; border-right:1px solid #dce7ef;}
.work-resource-table th:first-child {width:40%;}
.work-resource-table td {vertical-align:top; padding:8px 10px; border-right:1px solid #dce7ef;}
.work-resource-table .work-resource-entry {padding:8px 0; border-bottom:1px solid #e8eef3;}
.work-resource-table .work-resource-entry:last-child {border-bottom:0; padding-bottom:0;}
.work-resource-table .work-resource-entry strong {font-size:12px; overflow-wrap:anywhere;}
.work-resource-table .work-resource-entry p {font-size:11px; margin:3px 0 5px !important; color:#567087;}
.work-resource-crew {border-left:2px solid #80b6c9; padding-left:8px; margin-top:5px;}
.work-resource-empty {color:#8495a5; font-size:11px; padding:8px 0;}
.work-resource-add {float:right; margin-left:6px; font-size:11px; padding:2px 6px;}
.work-resource-summary {font-size:12px; color:#53728a; padding:4px 0; cursor:pointer;}
[data-work-resources-row] > td {padding:4px 0 12px !important; background:#fff;}
</style>
{{ resource_editor_data|json_script:'resource-editor-data' }}
{% if can_prepare_resources %}
<form id="work-resource-form" method="post" action="{{ resource_assignment_url }}" hidden>{% csrf_token %}</form>
<template id="work-resource-editor-template"><section class="border border-primary rounded p-3 my-2 bg-light" data-inline-resource-editor aria-label="Редактирование ресурса"><input type="hidden" name="assignment_id"><input type="hidden" name="resource_revision"><input type="hidden" name="resource_kind">
{{ inline_resource_form.work }}{{ inline_resource_form.work_item }}

<h3 class="h6" id="work-resource-title">Добавить ресурс</h3><p id="work-resource-target"></p>
<div class="alert alert-danger" id="work-resource-errors" role="alert" hidden></div>
<div data-resource-field="equipment"><label class="form-label">Вид техники</label>{{ inline_resource_form.equipment_type }}<p class="mt-2">{{ inline_resource_form.include_crew }} {{ inline_resource_form.include_crew.label }}</p></div>
<div data-resource-field="labor"><label class="form-label">Должность</label>{{ inline_resource_form.position }}</div>
<div data-resource-field="fuel"><label class="form-label">Вид ГСМ</label>{{ inline_resource_form.fuel_type }}<label class="form-label mt-2">Расход в день, л</label>{{ inline_resource_form.daily_liters }}<label class="form-label mt-2">Цена литра, ₽</label>{{ inline_resource_form.fuel_price }}</div>
{% include 'planning/_resource_targets_picker.html' with target_form=inline_resource_form %}
<div class="row mt-3"><div class="col-sm-6"><label class="form-label">Начало</label>{{ inline_resource_form.start_date }}</div><div class="col-sm-6"><label class="form-label">Окончание</label>{{ inline_resource_form.end_date }}</div></div>
<div class="row mt-3" data-resource-field="quantity"><div class="col-sm-4"><label class="form-label">Количество на смену</label>{{ inline_resource_form.count }}</div><div class="col-sm-4"><label class="form-label">Смен в день</label>{{ inline_resource_form.shifts_per_day }}</div><div class="col-sm-4"><label class="form-label">Часов в смене</label>{{ inline_resource_form.hours_per_shift }}</div></div>
<p class="mt-3">{{ inline_resource_form.refresh_crew }} {{ inline_resource_form.refresh_crew.label }}</p>
<p class="small text-muted">Ресурс появится в общих ресурсах с указанием работы и будет учтён один раз. Редактирование выполняется на месте. Изменения месячных объёмов сохраняются отдельно кнопкой «Сохранить».</p>
<div class="d-flex flex-wrap gap-2 mt-3"><button class="btn btn-primary" type="submit">Сохранить ресурс</button><button class="btn btn-outline-secondary" type="button" data-close-resource>Отмена</button><button class="btn btn-outline-danger" type="button" data-delete-resource hidden>Удалить назначение</button><button class="btn btn-danger" type="button" data-confirm-delete-resource hidden>Подтвердить удаление</button></div>
</section></template>
<div id="work-resource-editor-fallback"></div>
{% endif %}
<script src="{% static 'planning/resource_targets.js' %}?v=20261026-graph" defer></script>
<script src="{% static 'planning/resource_editor.js' %}?v=20261026-graph" defer></script>
