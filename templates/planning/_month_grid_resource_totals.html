{% load revenue_tags l10n %}<span class="month-grid-package-label"><span data-plan-group-name>{{ group.label }}</span> <small class="text-muted"><span data-grid-total-caption>Итого</span> · {{ group.unit }}</small></span>{% for cell in group.totals %}<span class="month-grid-ready-value" data-grid-total-month="{{ cell.month|date:'Y-m-d' }}" data-value="{{ cell.value|unlocalize }}" title="Итого · {{ cell.month|date:'m.Y' }} · {{ group.unit }}"><strong data-grid-total-number>{{ cell.value|average_number }}</strong></span>{% endfor %}
