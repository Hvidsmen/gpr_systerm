<details class="plan-workbench-filter-panel" {% if table_editable or not schedule %}open{% endif %}><summary>Настройки отображения и фильтры</summary><section class="plan-workbench-tools card p-3 mb-3" aria-label="Инструменты планирования">

<div class="plan-workbench-filter-row mt-3"><label>Поиск работ и ресурсов<input id="smg-search" data-grid-search type="search" class="form-control form-control-sm" placeholder="Название работы, комплексного объекта, техники или должности"></label><label>Состав плана<select id="smg-kind" data-grid-filter data-native-select class="form-select form-select-sm"><option value="">Все работы и ресурсы</option>{% for section in plan_sections %}<option value="{{ section.kind }}">{{ section.label }}</option>{% endfor %}</select></label>{% if not gpr_period_grid %}<nav class="plan-month-picker mb-0" aria-label="Месяцы плана" data-workbench-month-picker><label>Год<select class="form-select form-select-sm" data-workbench-year data-native-select>{% for year in plan_years %}<option value="{{ year|stringformat:'d' }}" {% if year == plan_month.year %}selected{% endif %}>{{ year|stringformat:'d' }}</option>{% endfor %}</select></label><label>Месяц<select class="form-select form-select-sm" data-workbench-month data-native-select>{% for option in plan_month_options %}<option value="{{ option.url }}" data-month="{{ option.month|date:'Y-m' }}" {% if option.month == plan_month %}selected{% endif %}>{{ option.month|date:'m.Y' }}</option>{% endfor %}</select></label></nav>{% endif %}{% if has_direct_reference %}<label class="plan-deviations"><input id="smg-deviations" type="checkbox"> Только отклонения</label>{% else %}<input id="smg-deviations" type="checkbox" hidden disabled>{% endif %}</div>
<details class="plan-extra-filters mt-3"><summary class="small">Фильтры работ и ресурсов</summary><div class="plan-multi-filters mt-2" data-plan-multi-filters></div></details>
<div class="d-flex flex-wrap gap-2 mt-3"><button id="smg-reset" type="button" class="btn btn-outline-secondary btn-sm">Сбросить</button><button data-plan-expand="true" type="button" class="btn btn-outline-secondary btn-sm">Развернуть всё</button><button data-plan-expand="false" type="button" class="btn btn-outline-secondary btn-sm">Свернуть всё</button><label class="plan-level-picker">Уровень <select class="form-select form-select-sm" data-plan-level-select data-native-select><option value="section">Разделы</option><option value="object">Комплексные объекты</option><option value="package">Комплексные работы</option></select></label><button type="button" class="btn btn-outline-secondary btn-sm" data-plan-fold-level="false">Свернуть уровень</button><button type="button" class="btn btn-outline-secondary btn-sm" data-plan-fold-level="true">Развернуть уровень</button><span class="flex-grow-1"></span><button type="button" class="btn btn-outline-primary btn-sm" data-plan-copy-table data-grid-copy>Копировать таблицу в Excel</button><button type="button" class="btn btn-outline-secondary btn-sm" data-plan-excel-help>Как работать с Excel</button></div>
<p class="small text-muted mb-0 mt-2" data-plan-copy-status {% if gpr_period_grid %}data-grid-status{% endif %} role="status" aria-live="polite">Работы и ресурсы добавляются здесь, связи настраиваются в «Связях работ и ресурсов». Общий ресурс учитывается один раз.</p>
</section></details>
