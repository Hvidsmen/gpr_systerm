{% load revenue_tags %}<td class="matrix-plan">{{ c.before|compact_number }}</td><td>{{ c.after|compact_number }}</td><td class="{% if c.delta > 0 %}text-success{% elif c.delta < 0 %}text-danger{% endif %}">{{ c.delta|compact_number }}</td>{% for cell in c.cells %}<td class="{% if cell.delta %}table-warning{% endif %}">{{ cell.after|compact_number }}{% if cell.delta %}<small>ГПР: {{ cell.before|compact_number }}</small>{% endif %}</td>{% endfor %}
