{% extends 'base.html' %}
{% load i18n %}

{% block title %}Удалить календарь{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0"><i class="bi bi-exclamation-triangle-fill"></i> Подтверждение удаления</h4>
            </div>
            <div class="card-body">
                <p>Вы действительно хотите удалить календарь:</p>
                <div class="card bg-light mb-3">
                    <div class="card-body">
                        <h5 class="card-title">{{ object.name }}</h5>
                        <p class="card-text mb-1"><strong>Год:</strong> {{ object.year }}</p>
                        <p class="card-text mb-0"><strong>Дней:</strong> {{ object.days.count }}</p>
                    </div>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Да, удалить
                        </button>
                        <a href="{% url 'planning:calendar_list' %}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
