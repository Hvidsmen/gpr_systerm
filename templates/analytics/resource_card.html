{% load revenue_tags %}<div class="revenue-kpi"><span data-resource-total-label>{{ label }}</span><div class="resource-card-values"><div><small>План</small><strong data-resource-total="plan">{{ cell.plan|resource_number:kind }}</strong></div><div><small>Факт</small><strong data-resource-total="fact">{{ cell.fact|resource_number:kind }}</strong></div><div><small>Отклонение</small><strong data-resource-total="delta" class="{% if cell.delta < 0 %}text-danger{% endif %}">{{ cell.delta|resource_number:kind }}</strong></div></div></div>
