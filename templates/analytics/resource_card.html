{% load revenue_tags %}<div class="revenue-kpi"><span>{{ label }}</span><div class="d-flex justify-content-between gap-2"><div><small>План</small><strong>{{ cell.plan|number }}</strong></div><div><small>Факт</small><strong>{{ cell.fact|number }}</strong></div><div><small>Δ</small><strong class="{% if cell.delta < 0 %}text-danger{% endif %}">{{ cell.delta|number }}</strong></div></div>{% if cell.partial %}<small>Частичный факт: {{ cell.known }} из {{ cell.count }} позиций</small>{% endif %}</div>
