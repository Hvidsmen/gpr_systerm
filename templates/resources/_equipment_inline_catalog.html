<dialog class="equipment-inline-dialog" data-equipment-dialog="type" aria-labelledby="equipment-inline-type-title"><form method="post" action="{% url 'resources:equipment_type_quick_create' %}" data-equipment-inline-form="type">{% csrf_token %}<h2 class="h5" id="equipment-inline-type-title">Новая техника для планирования</h2><label class="d-block mt-3">Название<input class="form-control" name="name" maxlength="150" required></label><label class="d-block mt-3" for="equipment-inline-category">Группа техники</label><div class="equipment-inline-field"><select class="form-select" name="category" id="equipment-inline-category" data-equipment-group-select><option value="">Без группы</option>{% for group in form.inline_groups %}<option value="{{ group.pk }}">{{ group.name }}</option>{% endfor %}</select><button type="button" class="btn btn-outline-primary" data-equipment-inline="group" data-target="equipment-inline-category" aria-label="Добавить группу техники">+</button></div><label class="d-block mt-3">Единица измерения<input class="form-control" name="unit" value="ед." maxlength="50" required></label><p class="text-danger small mt-3" data-equipment-inline-errors role="alert"></p><div class="d-flex justify-content-end gap-2"><button type="button" class="btn btn-outline-secondary" data-equipment-inline-close>Отмена</button><button class="btn btn-primary">Добавить и выбрать</button></div></form></dialog>
<dialog class="equipment-inline-dialog" data-equipment-dialog="group" aria-labelledby="equipment-inline-group-title"><form method="post" action="{% url 'resources:equipment_category_create' %}" data-equipment-inline-form="group">{% csrf_token %}<h2 class="h5" id="equipment-inline-group-title">Новая группа техники</h2><label class="d-block mt-3">Название<input class="form-control" name="name" maxlength="100" required></label><p class="text-danger small mt-3" data-equipment-inline-errors role="alert"></p><div class="d-flex justify-content-end gap-2"><button type="button" class="btn btn-outline-secondary" data-equipment-inline-close>Отмена</button><button class="btn btn-primary">Добавить и выбрать</button></div></form></dialog>
