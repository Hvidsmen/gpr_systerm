{% load access static %}{% if request.user|may:'resources:brigade_bulk_group' %}
<dialog class="brigade-group-dialog" data-bulk-group-dialog aria-labelledby="bulk-group-title">
<header class="d-flex justify-content-between align-items-center gap-3"><h2 class="h5 mb-0" id="bulk-group-title">Назначить группу должностям</h2><button type="button" class="btn-close" data-bulk-group-close aria-label="Закрыть"></button></header>
<p class="small mt-3" data-bulk-group-count></p>
<form method="post" action="{% url 'resources:brigade_bulk_group' %}">{% csrf_token %}
<input type="hidden" name="return_query" value="{{ request.GET.urlencode }}"><div data-bulk-group-selection></div>
{% include 'forms/fields.html' with form=group_assignment_form %}
<p class="small text-muted">«Не менять» сохраняет текущее назначение. «Без группы» снимает его у выбранных должностей.</p>
<div class="d-flex gap-2"><button class="btn btn-primary">Применить к выбранным</button><button type="button" class="btn btn-outline-secondary" data-bulk-group-close>Отмена</button></div>
</form></dialog>
<script src="{% static 'resources/brigade_bulk_group.js' %}" defer></script>
{% endif %}
