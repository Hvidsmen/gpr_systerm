<section class="card card-body mb-3" data-entry-step="4" data-daily-summary data-url="{% url 'production:smg_period_detail' %}">
  <div class="d-flex justify-content-between align-items-start flex-wrap gap-2"><h2>Сводный отчёт за {{ day|date:'d.m.Y' }}</h2><button type="button" class="btn btn-sm btn-outline-primary" data-daily-summary-refresh>Обновить отчёт</button></div>
  <p class="small text-muted">План и сохранённый факт только за выбранный день. Структура, группировка и показатели совпадают с вкладкой «План / факт СМГ».</p>
  <p data-daily-summary-state role="status" aria-live="polite">Откройте вкладку для построения отчёта.</p>
  <div data-daily-summary-content></div>
</section>
{{ production_report_people|json_script:'production-report-people' }}
