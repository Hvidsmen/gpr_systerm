<section class="card card-body mb-3" data-entry-step="5" data-daily-summary data-url="{% url 'production:smg_period_detail' %}">
  <div class="d-flex justify-content-between align-items-start flex-wrap gap-2"><h2>Сводный отчёт за {{ day|date:'d.m.Y' }}</h2><button type="button" class="btn btn-sm btn-outline-primary" data-daily-summary-refresh>Обновить отчёт</button></div>
  <p class="small text-muted">План и сохранённый факт только за выбранный день. Структура, группировка и показатели совпадают с вкладкой «План / факт СМГ».</p>
  <div class="production-control-summary" data-daily-control-summary aria-live="polite"></div>
  <div class="production-report-filters"><input type="search" class="form-control" placeholder="Поиск по работе или объекту" aria-label="Поиск в дневном отчёте" data-report-search><select class="form-select" data-report-mode aria-label="Фильтр дневного отчёта"><option value="all">Все строки</option><option value="actual">Есть факт</option><option value="missing">Нет факта</option><option value="deviation">Есть отклонение</option></select></div>
  <p data-daily-summary-state role="status" aria-live="polite">Откройте вкладку для построения отчёта.</p>
  <div data-daily-summary-content></div>
</section>
{{ production_report_people|json_script:'production-report-people' }}
