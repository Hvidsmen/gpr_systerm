{% if details %}<section class="card card-body mt-3"><h2 class="h5">Сведения по технике · {{ details.date|date:'d.m.Y' }}</h2><dl>{% for label,value in details.display_fields %}<dt>{{ label }}</dt><dd class="text-break" style="white-space:pre-line">{{ value }}</dd>{% empty %}<dd>Дополнительные сведения не заполнены.</dd>{% endfor %}</dl></section>{% endif %}
