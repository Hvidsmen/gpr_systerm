<div class="app-form-field{% if field.errors %} app-field-invalid{% endif %}"><div class="app-form-label">{{ field.label_tag }}{% if field.field.required %}<span class="app-required" aria-hidden="true">*</span>{% endif %}</div>{{ field }}{% if field.help_text %}<div class="app-form-help">{{ field.help_text }}</div>{% endif %}{% if field.errors %}<div class="app-form-errors" role="alert">{{ field.errors }}</div>{% endif %}</div>
