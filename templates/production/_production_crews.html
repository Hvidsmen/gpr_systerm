{% load static %}<section class="card card-body mb-3" data-entry-step="3" data-production-crews data-url="{% url 'production:production_crews' %}">
  <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
    <div><h2>Бригады <span class="small text-muted">· необязательно</span></h2><p class="small text-muted mb-0">Бригады создаются только на выбранный день, объект и смену. Сотрудник может состоять только в одной бригаде.</p></div>
    {% if editable %}<button type="button" class="btn btn-sm btn-outline-primary" data-crews-copy>Скопировать с предыдущего дня</button>{% endif %}
  </div>
  {% if editable %}<div class="d-flex gap-2 align-items-end flex-wrap my-3"><label>Смена<select class="form-select" data-crew-new-shift><option value="1">День</option><option value="2">Ночь</option></select></label><label class="flex-grow-1">Название <span class="text-muted">(необязательно)</span><input class="form-control" maxlength="160" data-crew-new-name placeholder="Например, электромонтажники"></label><button type="button" class="btn btn-primary" data-crew-create>Создать бригаду</button></div>{% endif %}
  <p class="small" data-crews-state role="status" aria-live="polite">Загрузка бригад…</p>
  <div class="d-flex gap-2 mb-2"><button type="button" class="btn btn-sm btn-outline-secondary" data-crews-expand>Развернуть все</button><button type="button" class="btn btn-sm btn-outline-secondary" data-crews-collapse>Свернуть все</button></div>
  <div class="production-crews-grid" data-crews-list></div>
</section>
<script src="{% static 'production/production_crews.js' %}?v=20261106-crew-link-origin" defer></script>
