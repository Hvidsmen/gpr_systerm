{% extends 'base.html' %}{% block content %}<h1>Факт ресурсов за день</h1><form method="get">{{ form.as_p }}<button>Показать план</button></form>{% if plans %}<form method="post">{% csrf_token %}<input type="hidden" name="construction_object" value="{{ form.cleaned_data.construction_object.pk }}"><input type="hidden" name="date" value="{{ form.cleaned_data.date|date:'Y-m-d' }}">{% for plan in plans %}<p><label>{{ plan }} <input type="number" min="0" step="0.01" name="value_{{ plan.pk }}" required></label><input type="hidden" name="plan_ids" value="{{ plan.pk }}"></p>{% endfor %}<button>Сохранить факт</button></form>{% endif %}{{ errors }}{% endblock %}
