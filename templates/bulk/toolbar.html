{% load access static %}{% if request.user|may:bulk_route %}
<form method="post" action="{% url bulk_route kind=bulk_kind %}" id="bulk-delete-form" class="d-flex flex-wrap align-items-center gap-2 mb-3">{% csrf_token %}<input type="hidden" name="return_query" value="{{ request.GET.urlencode }}"><button type="button" class="btn btn-sm btn-outline-secondary" data-bulk-select>Выбрать все на странице</button><button type="button" class="btn btn-sm btn-outline-secondary" data-bulk-clear>Снять выбор</button>{% if bulk_kind == 'works' %}<button class="btn btn-sm btn-outline-primary" formaction="{% url 'works:work_merge' %}" name="merge_stage" value="select" title="Выберите не менее двух простых работ одного объекта" data-bulk-merge disabled>Объединить в составную</button>{% endif %}{% if bulk_kind == 'equipment' %}{% if request.user|may:'resources:equipment_type_merge' %}<button class="btn btn-sm btn-outline-primary" formaction="{% url 'resources:equipment_type_merge' %}" name="merge_stage" value="select" data-bulk-equipment-merge disabled>Объединить выбранные</button>{% endif %}{% endif %}<span class="small" data-bulk-count>Выбрано: 0</span><button class="btn btn-sm btn-outline-danger" data-bulk-submit disabled>Удалить выбранные</button></form>
<script src="{% static 'core/bulk_delete.js' %}" defer></script>
{% endif %}
